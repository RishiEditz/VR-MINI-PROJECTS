<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Quiz App</title>
  <meta name="description" content="A quiz app built with plain HTML, CSS and JavaScript. Pick a topic, beat the timer, review your answers and save your best score in the browser.">
  <meta name="theme-color" content="#ff5c8a">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <main class="app">
    <header class="head">
      <div>
        <p class="eyebrow">Test yourself</p>
        <h1>Quiz App</h1>
      </div>
      <p class="best" id="best" aria-live="polite">Best: none yet</p>
    </header>

    <!-- Start screen: pick a topic -->
    <section class="screen is-active" id="screen-start" aria-labelledby="start-title">
      <h2 id="start-title" class="screen__title">Pick a topic</h2>
      <p class="screen__lead">Five questions. Fifteen seconds each. Go.</p>
      <div class="topics" id="topics"></div>
    </section>

    <!-- Quiz screen -->
    <section class="screen" id="screen-quiz" aria-live="off">
      <div class="quiz__top">
        <p class="quiz__count" id="count">Question 1 of 5</p>
        <p class="quiz__score"><span id="score">0</span> pts</p>
      </div>
      <div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress">
        <div class="progress__fill" id="progress-fill"></div>
      </div>

      <div class="timer" aria-label="Time left">
        <div class="timer__bar"><div class="timer__fill" id="timer-fill"></div></div>
        <p class="timer__text" id="timer-text">15</p>
      </div>

      <h2 class="question" id="question" tabindex="-1"></h2>
      <div class="options" id="options" role="group" aria-label="Answers"></div>

      <div class="feedback" id="feedback" role="status" aria-live="polite" hidden>
        <p class="feedback__title" id="feedback-title"></p>
        <p class="feedback__text" id="feedback-text"></p>
      </div>

      <div class="quiz__actions">
        <p class="hint">Keys 1 to 4 pick an answer, Enter goes next.</p>
        <button type="button" class="btn btn--primary" id="next" disabled>Next</button>
      </div>
    </section>

    <!-- Result screen -->
    <section class="screen" id="screen-result" aria-labelledby="result-title">
      <div class="result__hero">
        <p class="result__label" id="result-label">Quiz complete</p>
        <p class="result__score" id="result-score">0/5</p>
        <p class="result__msg" id="result-msg"></p>
        <p class="result__best" id="result-best"></p>
      </div>

      <h3 class="review__title">Review your answers</h3>
      <ol class="review" id="review"></ol>

      <div class="result__actions">
        <button type="button" class="btn btn--primary" id="restart">Play again</button>
        <button type="button" class="btn btn--ghost" id="change-topic">Change topic</button>
      </div>
    </section>
  </main>

  <div class="burst-layer" id="burst" aria-hidden="true"></div>
  <p class="sr-only" id="status" role="status" aria-live="polite"></p>

  <script src="script.js"></script>
</body>
</html>
