<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tic-Tac-Toe vs Computer</title>
  <meta name="description" content="Play tic-tac-toe against the computer. Easy mode makes mistakes, Unbeatable mode never loses. Scores are saved on your device. Plain HTML, CSS and JavaScript.">
  <meta name="theme-color" content="#04222b">
  <meta property="og:title" content="Tic-Tac-Toe vs Computer">
  <meta property="og:description" content="Can you beat the computer? Pick Easy or Unbeatable and play.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2329c7b8'/%3E%3Cstop offset='1' stop-color='%23063a4a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M18 18l14 14M32 18 18 32' stroke='%23ff6b6b' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='42' cy='42' r='9' fill='none' stroke='%23ffd45e' stroke-width='6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg" aria-hidden="true"><span class="blob blob--a"></span><span class="blob blob--b"></span><span class="blob blob--c"></span></div>

  <main class="app">
    <header class="head">
      <div class="head__titles">
        <p class="eyebrow">Mini Projects &middot; Day 13</p>
        <h1>Tic-Tac-Toe vs Computer</h1>
      </div>
      <button type="button" class="btn btn--ghost btn--icon" id="theme" aria-label="Switch to light theme" title="Switch theme">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path id="theme-icon" d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </header>

    <section class="options" aria-label="Options">
      <div class="opt">
        <span class="opt__label" id="lbl-diff">Difficulty</span>
        <div class="seg" role="radiogroup" aria-labelledby="lbl-diff" id="seg-diff">
          <button type="button" role="radio" aria-checked="false" data-diff="easy">Easy</button>
          <button type="button" role="radio" aria-checked="true" data-diff="hard">Unbeatable</button>
        </div>
      </div>
      <div class="opt">
        <span class="opt__label" id="lbl-first">Goes first</span>
        <div class="seg" role="radiogroup" aria-labelledby="lbl-first" id="seg-first">
          <button type="button" role="radio" aria-checked="true" data-first="you">You</button>
          <button type="button" role="radio" aria-checked="false" data-first="cpu">Computer</button>
        </div>
      </div>
    </section>

    <p class="status" id="status" role="status" aria-live="polite">Your turn. You are X.</p>

    <section class="stage" aria-label="Game board">
      <div class="board" id="board" role="grid" aria-label="Tic-tac-toe board"></div>
      <svg class="winline" id="winline" viewBox="0 0 300 300" aria-hidden="true"><line id="winline-l" x1="0" y1="0" x2="0" y2="0"/></svg>
    </section>

    <section class="score" aria-label="Score">
      <div class="score__cell score__cell--you"><span class="score__name">You (X)</span><strong id="s-you">0</strong></div>
      <div class="score__cell"><span class="score__name">Draws</span><strong id="s-draw">0</strong></div>
      <div class="score__cell score__cell--cpu"><span class="score__name">Computer (O)</span><strong id="s-cpu">0</strong></div>
    </section>

    <section class="actions" aria-label="Actions">
      <button type="button" class="btn btn--primary" id="new">New game</button>
      <button type="button" class="btn" id="reset">Reset score</button>
    </section>

    <p class="hint">Keys: <kbd>1</kbd> to <kbd>9</kbd> pick a square, <kbd>N</kbd> new game. Scores stay on this device.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
