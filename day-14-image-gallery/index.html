<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Image Gallery with Filters</title>
  <meta name="description" content="A picture gallery with category filters, search, favorites, a full-screen viewer and photo effects. Every picture is drawn in code. Plain HTML, CSS and JavaScript.">
  <meta name="theme-color" content="#240618">
  <meta property="og:title" content="Image Gallery with Filters">
  <meta property="og:description" content="Filter by category, search, save favorites and view each picture full screen with photo effects.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff8a3d'/%3E%3Cstop offset='1' stop-color='%23a21d5c'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Crect x='14' y='16' width='36' height='32' rx='6' fill='none' stroke='%23fff3e6' stroke-width='5'/%3E%3Ccircle cx='26' cy='28' r='4' fill='%23fff3e6'/%3E%3Cpath d='M18 44l11-10 8 7 5-4 8 7' fill='none' stroke='%23fff3e6' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg" aria-hidden="true"><span class="blob blob--a"></span><span class="blob blob--b"></span><span class="blob blob--c"></span></div>

  <main class="app">
    <header class="head">
      <div class="head__titles">
        <p class="eyebrow">Mini Projects &middot; Day 14</p>
        <h1>Image Gallery</h1>
      </div>
      <button type="button" class="btn btn--ghost btn--icon" id="theme" aria-label="Switch to light theme" title="Switch theme">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path id="theme-icon" d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </header>

    <div class="tools">
      <label class="search" for="q">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        <span class="sr">Search pictures</span>
        <input id="q" type="search" placeholder="Search: sunset, neon, moon..." autocomplete="off" enterkeyhint="search">
      </label>
      <div class="chips" id="chips" role="tablist" aria-label="Filter by category"></div>
    </div>

    <p class="count" id="count" role="status" aria-live="polite"></p>

    <ul class="grid" id="grid" aria-label="Pictures"></ul>
    <p class="empty" id="empty" hidden>No pictures match. Try another word or category.</p>

    <p class="hint">Keys: <kbd>&larr;</kbd> <kbd>&rarr;</kbd> browse, <kbd>F</kbd> favorite, <kbd>Space</kbd> slideshow, <kbd>Esc</kbd> close. Favorites stay on this device.</p>
  </main>

  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Picture viewer" hidden>
    <div class="viewer__bar">
      <p class="viewer__count" id="v-count"></p>
      <button type="button" class="btn btn--icon" id="v-close" aria-label="Close viewer">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="viewer__stage" id="v-stage">
      <button type="button" class="btn btn--icon nav nav--prev" id="v-prev" aria-label="Previous picture">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <figure class="viewer__fig" id="v-fig"></figure>
      <button type="button" class="btn btn--icon nav nav--next" id="v-next" aria-label="Next picture">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="viewer__info">
      <div class="viewer__title">
        <h2 id="v-title"></h2>
        <p id="v-meta"></p>
      </div>
      <div class="viewer__actions">
        <button type="button" class="btn" id="v-fav" aria-pressed="false">Favorite</button>
        <button type="button" class="btn" id="v-play" aria-pressed="false">Slideshow</button>
      </div>
    </div>
    <div class="viewer__fx">
      <div class="fx" id="fx" role="radiogroup" aria-label="Photo effect"></div>
      <label class="bright"><span>Brightness</span><input type="range" id="bright" min="60" max="140" value="100" step="5"></label>
    </div>
  </div>

  <script src="gallery-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
