<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>To-do List</title>
  <meta name="description" content="A to-do list built with plain HTML, CSS and JavaScript. Add, edit, reorder, filter and clear tasks. Saved in your browser.">
  <meta name="theme-color" content="#7c3aed">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <main class="app">
    <header class="head">
      <div>
        <p class="eyebrow">Your day</p>
        <h1>To-do List</h1>
      </div>
      <p class="counter" id="counter" aria-live="polite">0 left</p>
    </header>

    <form class="composer" id="composer" autocomplete="off">
      <div class="composer__row">
        <label class="sr-only" for="new-task">New task</label>
        <input class="field" id="new-task" name="task" type="text" maxlength="120" placeholder="What needs doing?" required>
        <button class="btn btn--primary" type="submit">Add</button>
      </div>
      <fieldset class="prio">
        <legend class="sr-only">Priority</legend>
        <label class="chip chip--low"><input type="radio" name="prio" value="low"><span>Low</span></label>
        <label class="chip chip--med"><input type="radio" name="prio" value="med" checked><span>Medium</span></label>
        <label class="chip chip--high"><input type="radio" name="prio" value="high"><span>High</span></label>
      </fieldset>
    </form>

    <div class="filters" role="group" aria-label="Show tasks">
      <button type="button" class="filter" data-filter="all" aria-pressed="true">All <span class="count">0</span></button>
      <button type="button" class="filter" data-filter="active" aria-pressed="false">Active <span class="count">0</span></button>
      <button type="button" class="filter" data-filter="done" aria-pressed="false">Done <span class="count">0</span></button>
    </div>

    <ul class="list" id="list" aria-label="Tasks"></ul>
    <p class="empty" id="empty" hidden></p>

    <footer class="foot">
      <button type="button" class="btn btn--ghost" id="clear-done" disabled>Clear completed</button>
      <p class="tip">Tip: Alt + Up or Down moves the focused task.</p>
    </footer>
  </main>

  <div class="confetti-layer" id="confetti" aria-hidden="true"></div>
  <p class="sr-only" id="status" role="status" aria-live="polite"></p>

  <script src="script.js"></script>
</body>
</html>
