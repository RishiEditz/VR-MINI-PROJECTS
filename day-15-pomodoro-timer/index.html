<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pomodoro Focus Timer</title>
  <meta name="description" content="A Pomodoro focus timer with focus, short break and long break modes, custom lengths, a daily focus log and a seven day chart. Plain HTML, CSS and JavaScript.">
  <meta name="theme-color" content="#1c0a0e">
  <meta property="og:title" content="Pomodoro Focus Timer">
  <meta property="og:description" content="Work in focused sprints with timed breaks, and see how much you focused today and this week.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff7a4a'/%3E%3Cstop offset='1' stop-color='%23c2271f'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%231c0a0e'/%3E%3Ccircle cx='32' cy='36' r='19' fill='url(%23g)'/%3E%3Cpath d='M32 17c-1-6 3-9 8-9-1 5-3 8-8 9z' fill='%2362d99a'/%3E%3Cpath d='M32 26v10l7 4' fill='none' stroke='%23fff3ea' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body data-mode="focus">
  <div class="bg" aria-hidden="true"><span class="blob blob--a"></span><span class="blob blob--b"></span><span class="blob blob--c"></span></div>

  <main class="app">
    <header class="head">
      <div class="head__titles">
        <p class="eyebrow">Mini Projects &middot; Day 15</p>
        <h1>Focus Timer</h1>
      </div>
      <div class="head__actions">
        <button type="button" class="btn btn--ghost btn--icon" id="sound" aria-pressed="true" aria-label="Sound is on" title="Sound on or off">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path id="sound-wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button type="button" class="btn btn--ghost btn--icon" id="theme" aria-label="Switch to light theme" title="Switch theme">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path id="theme-icon" d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <div class="layout">
      <section class="timer card" aria-label="Timer">
        <div class="modes" role="tablist" aria-label="Timer mode" id="modes">
          <button type="button" role="tab" class="mode" data-mode="focus" aria-selected="true">Focus</button>
          <button type="button" role="tab" class="mode" data-mode="short" aria-selected="false">Short break</button>
          <button type="button" role="tab" class="mode" data-mode="long" aria-selected="false">Long break</button>
        </div>

        <div class="dial" id="dial">
          <svg class="dial__svg" viewBox="0 0 200 200" aria-hidden="true">
            <circle class="dial__track" cx="100" cy="100" r="88"/>
            <circle class="dial__ticks" cx="100" cy="100" r="96"/>
            <circle class="dial__arc" id="arc" cx="100" cy="100" r="88" transform="rotate(-90 100 100)"/>
          </svg>
          <div class="dial__text">
            <p class="dial__label" id="label">Focus</p>
            <p class="dial__time" id="time" role="timer" aria-live="off">25:00</p>
            <p class="dial__sub" id="sub">Ready when you are</p>
          </div>
        </div>

        <label class="task" for="task">
          <span class="sr">What are you working on</span>
          <input id="task" type="text" maxlength="60" placeholder="What are you focusing on?" autocomplete="off" enterkeyhint="done">
        </label>

        <div class="controls">
          <button type="button" class="btn btn--ghost btn--icon btn--lg" id="reset" aria-label="Reset timer" title="Reset (R)">
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M5 12a7 7 0 1 0 2.3-5.2M5 4v4.5h4.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button type="button" class="btn btn--primary btn--xl" id="start" title="Start or pause (Space)">Start</button>
          <button type="button" class="btn btn--ghost btn--icon btn--lg" id="skip" aria-label="Skip to next session" title="Skip (S)">
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M6 5.5v13l8.5-6.5zM17.5 5.5v13" fill="currentColor" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <div class="cycle" id="cycle" aria-label="Sessions in this cycle"></div>
      </section>

      <aside class="side">
        <section class="card stats" aria-label="Today">
          <h2>Today</h2>
          <div class="stats__row">
            <div class="stat"><span class="stat__n" id="st-sessions">0</span><span class="stat__l">sessions</span></div>
            <div class="stat"><span class="stat__n" id="st-minutes">0</span><span class="stat__l">focus min</span></div>
            <div class="stat"><span class="stat__n" id="st-streak">0</span><span class="stat__l">day streak</span></div>
          </div>
          <div class="week" id="week" role="img" aria-label="Focus minutes in the last seven days"></div>
          <button type="button" class="btn btn--ghost btn--small" id="clear-stats">Clear history</button>
        </section>

        <section class="card settings" aria-label="Settings">
          <h2>Settings</h2>
          <div class="set" id="settings">
            <div class="set__row" data-key="focus"><span>Focus (min)</span><div class="step"><button type="button" class="btn btn--ghost btn--step" data-d="-1" aria-label="Less focus minutes">&minus;</button><output>25</output><button type="button" class="btn btn--ghost btn--step" data-d="1" aria-label="More focus minutes">+</button></div></div>
            <div class="set__row" data-key="short"><span>Short break (min)</span><div class="step"><button type="button" class="btn btn--ghost btn--step" data-d="-1" aria-label="Shorter short break">&minus;</button><output>5</output><button type="button" class="btn btn--ghost btn--step" data-d="1" aria-label="Longer short break">+</button></div></div>
            <div class="set__row" data-key="long"><span>Long break (min)</span><div class="step"><button type="button" class="btn btn--ghost btn--step" data-d="-1" aria-label="Shorter long break">&minus;</button><output>15</output><button type="button" class="btn btn--ghost btn--step" data-d="1" aria-label="Longer long break">+</button></div></div>
            <div class="set__row" data-key="every"><span>Long break every</span><div class="step"><button type="button" class="btn btn--ghost btn--step" data-d="-1" aria-label="Fewer sessions before a long break">&minus;</button><output>4</output><button type="button" class="btn btn--ghost btn--step" data-d="1" aria-label="More sessions before a long break">+</button></div></div>
            <label class="set__row set__row--switch"><span>Start next session on its own</span><input type="checkbox" id="auto" class="switch"></label>
          </div>
        </section>
      </aside>
    </div>

    <p class="foot">Space starts or pauses &middot; R resets &middot; S skips &middot; your settings and history stay on this device</p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="script.js"></script>
</body>
</html>
