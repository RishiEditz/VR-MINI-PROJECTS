<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Calculator</title>
  <meta name="description" content="A clean calculator with keyboard support, correct order of operations, parentheses, percent and a history of your last 20 calculations. Plain HTML, CSS and JavaScript.">
  <meta name="theme-color" content="#38d39a">
  <meta property="og:title" content="Calculator">
  <meta property="og:description" content="A clean calculator with keyboard support, parentheses, percent and history.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23d8ff5e'/%3E%3Cstop offset='.5' stop-color='%2338d39a'/%3E%3Cstop offset='1' stop-color='%230f5a6e'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='44' font-family='Arial' font-weight='700' font-size='36' text-anchor='middle' fill='%230a2118'%3E%3D%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <main class="app">
    <section class="calc" aria-label="Calculator">
      <header class="calc__head">
        <p class="eyebrow">Mini Projects &middot; Day 5</p>
        <h1>Calculator</h1>
      </header>

      <div class="display" id="display">
        <p class="display__expr" id="expr" aria-label="Expression"></p>
        <p class="display__preview" id="preview" aria-hidden="true"></p>
        <p class="display__value" id="value" aria-live="polite">0</p>
        <p class="display__status" id="status" role="status"></p>
      </div>

      <div class="keypad" id="keypad" role="group" aria-label="Keys">
        <button type="button" class="key key--fn" data-key="C" aria-label="Clear all">C</button>
        <button type="button" class="key key--fn" data-key="BS" aria-label="Backspace">
          <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M9.5 5H20a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9.5L3.5 12z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 9.5l5 5M17 9.5l-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button type="button" class="key key--fn" data-key="%" aria-label="Percent">%</button>
        <button type="button" class="key key--op" data-key="/" aria-label="Divide">&divide;</button>

        <button type="button" class="key" data-key="7">7</button>
        <button type="button" class="key" data-key="8">8</button>
        <button type="button" class="key" data-key="9">9</button>
        <button type="button" class="key key--op" data-key="*" aria-label="Multiply">&times;</button>

        <button type="button" class="key" data-key="4">4</button>
        <button type="button" class="key" data-key="5">5</button>
        <button type="button" class="key" data-key="6">6</button>
        <button type="button" class="key key--op" data-key="-" aria-label="Subtract">&minus;</button>

        <button type="button" class="key" data-key="1">1</button>
        <button type="button" class="key" data-key="2">2</button>
        <button type="button" class="key" data-key="3">3</button>
        <button type="button" class="key key--op" data-key="+" aria-label="Add">+</button>

        <button type="button" class="key key--fn" data-key="P" aria-label="Brackets">( )</button>
        <button type="button" class="key" data-key="0">0</button>
        <button type="button" class="key" data-key="." aria-label="Decimal point">.</button>
        <button type="button" class="key key--eq" data-key="=" aria-label="Equals">=</button>
      </div>

      <p class="hint">Keys work too: numbers, + - * /, Enter, Backspace, Esc</p>
    </section>

    <aside class="history" aria-labelledby="hist-title">
      <div class="history__head">
        <h2 id="hist-title">History</h2>
        <button type="button" class="btn-text" id="hist-clear">Clear</button>
      </div>
      <ol class="history__list" id="hist-list"></ol>
      <p class="history__empty" id="hist-empty">Your last 20 calculations show up here. Tap one to use its answer again.</p>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
